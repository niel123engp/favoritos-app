<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Favoritos — odds de valor</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Favoritos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg:#0B1220; --surface:#121A2B; --surface2:#182238; --border:#243049;
    --text:#F4F7FB; --muted:#C3CEDD; --muted2:#A3B1C6;
    --green:#34D399; --green-bg:rgba(52,211,153,.14);
    --amber:#FBBF24; --amber-bg:rgba(251,191,36,.14);
    --red:#F87171;   --red-bg:rgba(248,113,113,.14);
    --blue:#818CF8;  --blue-bg:rgba(129,140,248,.16);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, -apple-system, sans-serif; }
  body { padding-bottom: calc(68px + var(--safe-b)); }
  button { font-family:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  header { position:sticky; top:0; z-index:5; background:rgba(11,18,32,.92); backdrop-filter:blur(10px); padding:14px 18px 10px; border-bottom:1px solid var(--border); }
  .hrow { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .hdate { font-size:12px; color:var(--muted); font-weight:500; }
  h1 { margin:2px 0 0; font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .sync { display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 11px; font-size:11px; color:var(--muted); white-space:nowrap; }
  .sync .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .sync.off .dot { background:var(--red); }
  .sync.loading .dot { background:var(--amber); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3 } }

  main { padding:14px 16px 10px; max-width:560px; margin:0 auto; }
  .hrow, nav { max-width:560px; margin-left:auto; margin-right:auto; }
  .sheet { max-width:560px; margin:0 auto; }
  .tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 14px; }
  .tile .l { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; font-weight:500; }
  .tile .v { font-size:24px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }
  .tile .v.sm { font-size:17px; }
  .tiles.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .d { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .d.g{background:var(--green)} .d.a{background:var(--amber)} .d.r{background:var(--red)} .d.b{background:var(--blue)}

  .sec { display:flex; justify-content:space-between; align-items:center; margin:16px 2px 8px; }
  .sec h2 { margin:0; font-size:14px; font-weight:700; }
  .sec span { font-size:12px; color:var(--muted); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:13px 15px; margin-bottom:10px; }
  .card.tap:active { background:var(--surface2); }
  .card.bet { border-color:rgba(52,211,153,.35); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .meta { font-size:12px; color:var(--muted); font-weight:500; }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .pill.g{background:var(--green-bg);color:var(--green)} .pill.a{background:var(--amber-bg);color:var(--amber)}
  .pill.r{background:var(--red-bg);color:var(--red)} .pill.b{background:var(--blue-bg);color:var(--blue)} .pill.n{background:var(--surface2);color:var(--muted)}
  .pill .d{width:7px;height:7px}
  .jogo { font-size:16px; font-weight:700; margin-top:8px; letter-spacing:-.01em; }
  .fav { font-size:12px; color:var(--muted); margin-top:2px; }
  .fav b { color:var(--text); font-weight:600; }
  .nums { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; }
  .nums .k { font-size:10.5px; color:var(--muted2); }
  .nums .n { font-size:15px; font-weight:700; margin-top:1px; }
  .pos{color:var(--green)} .neg{color:var(--red)} .mid{color:var(--amber)}
  .res { font-size:12px; font-weight:800; border-radius:8px; padding:3px 8px; }
  .res.G{background:var(--green-bg);color:var(--green)} .res.R{background:var(--red-bg);color:var(--red)} .res.A{background:var(--surface2);color:var(--muted)}
  .empty { text-align:center; color:var(--muted); padding:40px 10px; font-size:14px; line-height:1.5; }

  .bar { position:relative; height:10px; background:var(--bg); border-radius:999px; border:1px solid var(--border); overflow:visible; margin:10px 0 6px; }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--green); }
  .bar .mk { position:absolute; top:-4px; bottom:-4px; width:2px; }
  .ticks { display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted2); }
  .hist { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .hist:last-child { border-bottom:0; }
  .hist .dt { width:52px; color:var(--muted); font-weight:500; }
  .hist .bw { flex:1; height:8px; background:var(--bg); border-radius:999px; overflow:hidden; }
  .hist .bw i { display:block; height:100%; border-radius:999px; }
  .hist .lu { width:84px; text-align:right; font-weight:700; }

  .alert { border-left:3px solid var(--border); }
  .alert.g{border-left-color:var(--green)} .alert.a{border-left-color:var(--amber)} .alert.r{border-left-color:var(--red)}
  .alert .msg { font-size:13px; line-height:1.45; margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .alert .when { font-size:11px; color:var(--muted2); }

  nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; justify-content:space-around; align-items:center; padding:8px 8px calc(10px + var(--safe-b)); background:#0E1626; border-top:1px solid var(--border); }
  nav button { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; color:var(--muted); font-size:11px; font-weight:500; min-width:50px; min-height:46px; }
  nav button.on { color:var(--green); font-weight:700; }
  nav svg { width:22px; height:22px; }

  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:flex-end; }
  .sheet { background:var(--surface); border-radius:22px 22px 0 0; width:100%; max-height:88vh; overflow:auto; padding:14px 18px calc(22px + var(--safe-b)); border-top:1px solid var(--border); }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 12px; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .kv > div { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .kv .k { font-size:10.5px; color:var(--muted2); } .kv .n { font-size:17px; font-weight:700; margin-top:2px; }
  .p { font-size:13px; line-height:1.5; color:var(--text); margin:8px 0; }
  .p b { color:var(--muted); font-weight:600; font-size:11.5px; display:block; margin-bottom:2px; text-transform:uppercase; letter-spacing:.04em; }
  .btn { width:100%; border:0; border-radius:14px; padding:14px; font-size:15px; font-weight:700; background:var(--green); color:#06281C; margin-top:10px; }
  .btn.ghost { background:var(--surface2); color:var(--text); }
  input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px; font-size:14px; font-family:inherit; }
  .note { font-size:12px; color:var(--muted); line-height:1.5; }
  .vcard { background:linear-gradient(0deg, var(--surface), var(--surface)); border:1px solid rgba(52,211,153,.45); border-radius:18px; padding:13px 15px; margin-bottom:10px; }
  .vcard.wait { border-color:rgba(251,191,36,.4); }
  .vtop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .vpick { font-size:19px; font-weight:800; margin-top:8px; letter-spacing:-.01em; }
  .vpick .o { color:var(--green); }
  .vcard.wait .vpick .o { color:var(--amber); }
  .vsub { font-size:12px; color:var(--muted); margin-top:2px; }
  .vline { display:flex; gap:14px; margin-top:8px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
  .vline b { color:var(--text); font-weight:700; }
  .acts { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-top:12px; }
  .acts button, .acts a { border:0; border-radius:12px; padding:12px 12px; font-size:14px; font-weight:800; text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; }
  .a-bet { background:var(--green); color:#06281C; }
  .vcard.wait .a-bet { background:var(--amber); color:#3A2A02; }
  .a-share { background:var(--surface2); color:var(--text); min-width:48px; }
  .a-info { background:var(--surface2); color:var(--muted); min-width:48px; }
  .acts svg { width:18px; height:18px; }
  .hero { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--green-bg); border:1px solid rgba(52,211,153,.35); border-radius:16px; padding:12px 14px; margin-bottom:12px; }
  .hero .t { font-size:13px; color:var(--green); font-weight:700; }
  .hero .s { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .hero button { border:0; border-radius:12px; padding:10px 12px; font-size:13px; font-weight:800; background:var(--green); color:#06281C; white-space:nowrap; }
  .hero.none { background:var(--surface); border-color:var(--border); }
  .hero.none .t { color:var(--muted); }
  .d.n{background:var(--muted2)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;min-height:38px}
  .chip.on{color:var(--text);background:var(--surface2);border-color:var(--muted)}
  .chip.on.g{border-color:var(--green)} .chip.on.a{border-color:var(--amber)} .chip.on.r{border-color:var(--red)}
  .chip small{font-size:11px;color:var(--muted2);font-weight:600}
  .search{margin:0 0 10px;padding:12px 14px;border-radius:14px}
  .gr{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--muted2);border-radius:14px;padding:10px 12px;margin-bottom:8px;content-visibility:auto;contain-intrinsic-size:auto 78px}
  .gr:active{background:var(--surface2)}
  .gr.g{border-left-color:var(--green)} .gr.a{border-left-color:var(--amber)} .gr.r{border-left-color:var(--red)}
  .gr.off{opacity:1}
  .gt{width:44px;flex:none;font-weight:800;font-size:13.5px;padding-top:1px}
  .gm{flex:1;min-width:0}
  .gj{font-weight:700;font-size:14.5px;line-height:1.25}
  .gs{font-size:11.5px;color:var(--muted);margin-top:2px}
  .gs b{color:var(--text);font-weight:600}
  .gx{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gv{text-align:right;font-size:12px;white-space:nowrap;flex:none}
  .gv .n{font-size:14px;font-weight:800}
  .gv .k{font-size:10.5px;color:var(--muted2)}
  .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.four .tile{padding:10px 10px}.tiles.four .tile .v{font-size:21px}
  .warn{background:var(--amber-bg);border:1px solid rgba(251,191,36,.35);color:var(--amber);border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.4;margin-bottom:10px}
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + var(--safe-b)); background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:12px; font-size:13px; z-index:30; }

  /* ===== reorganização 26/11: ficha da proposta, odd grande, selo de atualização ===== */
  .sync.fg .dot{background:var(--green)} .sync.fa .dot{background:var(--amber)} .sync.fr .dot{background:var(--red)} .sync.fn .dot{background:var(--muted2)}
  .sync.fr{border-color:rgba(248,113,113,.5);color:var(--red)} .sync.fa{border-color:rgba(251,191,36,.45);color:var(--amber)}
  .sec h2{display:flex;align-items:center;gap:7px} .sec span{text-align:right}
  .empty.sm{padding:16px 10px;font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:14px;margin-bottom:10px}
  .hr{color:var(--text);font-weight:800;font-size:13.5px}
  .pc{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--muted2);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .pc.g{border-left-color:var(--green)} .pc.a{border-left-color:var(--amber)} .pc.r{border-left-color:var(--red)} .pc.b{border-left-color:var(--blue)}
  .jg{font-size:13px;color:var(--muted);margin-top:6px;font-weight:500}
  .ent,.sug{display:flex;justify-content:space-between;align-items:stretch;gap:10px;margin-top:8px}
  .ent .k,.sug .k,.ob .k{font-size:10px;letter-spacing:.06em;color:var(--muted2);font-weight:700}
  .ent .e{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin-top:1px}
  .k2{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .ob{flex:none;min-width:78px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center}
  .ob .o{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .pc.g .ob{border-color:rgba(52,211,153,.5)} .pc.g .ob .o{color:var(--green)} .pc.a .ob .o{color:var(--amber)}
  .sug{background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:8px 10px;margin-top:10px}
  .sug .e{font-size:15px;font-weight:700;margin-top:1px} .sug .ob{border:0;padding:0 2px;min-width:64px} .sug .ob .o{font-size:19px}
  .mot{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lido{font-size:11.5px;font-weight:600} .lido.fg{color:var(--green)} .lido.fa{color:var(--amber)} .lido.fr{color:var(--red)} .lido.fn{color:var(--muted)}
  .vsub{margin-top:8px}
  .vd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:13px}
  .vd.ok{background:var(--green-bg);color:var(--green)} .vd.no{background:var(--red-bg);color:var(--red)}
  .placar{flex:none;font-weight:800;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px 8px;color:var(--text);white-space:nowrap}
  .acts .a-bet.a{background:var(--amber);color:#3A2A02} .acts .a-bet.r{background:var(--surface2);color:var(--text)}
  .acts button{font-size:13px}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--surface2);color:var(--muted);margin-top:3px}
  .tag.t{background:var(--blue-bg);color:var(--blue)}
  .gv .on{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .gv .pill{padding:3px 8px;margin-top:4px}
  details>summary{list-style:none;cursor:pointer} details>summary::-webkit-details-marker{display:none}
  details.grp>summary .sec span::after{content:" ▾"} details.grp[open]>summary .sec span::after{content:" ▴"}
  details.mais{margin-top:6px} details.mais>summary{font-size:12px;color:var(--blue);font-weight:700;padding:4px 0}
  .upbox{padding:10px 14px} .upbox summary{font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .up{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px}
  .pernas{margin-top:8px;border-top:1px solid var(--border)}
  .pn{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
  .pi{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .pt{flex:1;font-size:15px;font-weight:700;line-height:1.25} .pt .k2{font-weight:500}
  .po{flex:none;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .ap{margin-top:12px} .apb{height:6px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:5px} .apb i{display:block;height:100%;border-radius:999px}
  .chips.subs{position:sticky;top:62px;z-index:4;background:var(--bg);padding-top:6px;margin-top:-6px}
  .chips.subs .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .u5{display:inline-flex;gap:3px;vertical-align:middle} .u5 i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .u5 i.g{background:var(--green)} .u5 i.a{background:var(--amber)} .u5 i.r{background:var(--red)}
  .rx{display:flex;column-gap:6px;align-items:center;font-size:11.5px;margin-top:3px;flex-wrap:wrap} .rx .rn{font-weight:700;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .rx .rp{color:var(--muted)}
  .rxt{width:100%;border-collapse:collapse;font-size:12.5px} .rxt th{font-size:10px;color:var(--muted2);font-weight:700;text-align:left;padding:4px 4px;text-transform:uppercase;letter-spacing:.04em}
  .rxt td{padding:7px 4px;border-top:1px solid var(--border)} .rxt td:first-child{max-width:130px}
  nav button{position:relative;flex:1} .nb{position:absolute;top:0;left:calc(50% + 6px);background:var(--blue);color:#0B1220;font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px}

  /* ===== contraste 26/11: nada importante em cinza apagado; hierarquia por tamanho e peso ===== */
  .gs,.gx,.jg,.k2,.mot,.fav,.rx,.vsub,.vline{color:var(--text)}
  .gs{font-size:12.5px} .gx{font-size:12px;opacity:1} .rx{font-size:12.5px} .rx .rp,.rx .meta{color:var(--text)}
  .jg{font-size:14px;font-weight:600} .mot{font-size:12.5px}
  .gt{color:var(--text)} .gv .k{color:var(--muted)}
  .d.n,.gr,.pc{--cz:#8FA0B8} .d.n{background:var(--cz)} .gr,.pc{border-left-color:var(--cz)}
  .gr.g,.pc.g{border-left-color:var(--green)} .gr.a,.pc.a{border-left-color:var(--amber)} .gr.r,.pc.r{border-left-color:var(--red)} .pc.b{border-left-color:var(--blue)}
  .pill.n,.tag{color:var(--text)}
  .pos{color:#4ADE80} .neg{color:#FF8A8A} .mid{color:#FCD34D}
  nav button{color:var(--muted)} .chip{color:var(--text)} .chip small{color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="hdate" id="hdate">—</div>
      <h1 id="htitle">Apostar</h1>
    </div>
    <button class="sync loading" id="sync" type="button" aria-label="Atualizar"><span class="dot"></span><span id="synctxt">carregando…</span></button>
  </div>
</header>

<main id="main"><div class="empty">Carregando…</div></main>

<nav>
  <button type="button" data-tab="apostar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Apostar</button>

<script>
(() => {
  // ================== CONFIG ==================
  const API_URL = 'https://script.google.com/macros/s/AKfycbz1ZowgfolCmH6HWEH49olOa4p2WZASaI8r8uNgl922SOBMxCg10GNOQ5dB_phDy83L-w/exec';
  const LS = { key: 'fav.key', data: 'fav.data', at: 'fav.at', tab: 'fav.tab', sub: 'fav.sub' };
  const REFRESH_MS = 60 * 1000;
  const STAKE = 'R$ 100';

  // chave: vem no link (#k=...) uma vez e fica guardada no aparelho
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('k')) { localStorage.setItem(LS.key, hash.get('k')); history.replaceState(null, '', location.pathname); }
  let KEY = localStorage.getItem(LS.key) || '';

  // ABAS: Apostar · Múltiplas · Jogos · Análise · Conta. Os nomes antigos guardados no aparelho são convertidos.
  const TABS = ['apostar', 'multiplas', 'jogos', 'analise', 'conta'];
  const SUB = { analise: 'destaques', conta: 'apostas' };
  try { Object.assign(SUB, JSON.parse(localStorage.getItem(LS.sub) || '{}')); } catch (e) {}
  let data = null, tab = localStorage.getItem(LS.tab) || 'apostar', offline = false, carregando = false;
  const antigo = { hoje: ['apostar'], report: ['analise'], apostas: ['conta', 'apostas'], painel: ['conta', 'painel'], alertas: ['conta', 'alertas'] }[tab];
  if (antigo) { tab = antigo[0]; if (antigo[1]) SUB.conta = antigo[1]; }
  if (!TABS.includes(tab)) tab = 'apostar';
  if (!['destaques', 'jogos', 'acertos'].includes(SUB.analise)) SUB.analise = 'destaques';
  if (!['apostas', 'painel', 'alertas'].includes(SUB.conta)) SUB.conta = 'apostas';
  try { data = JSON.parse(localStorage.getItem(LS.data) || 'null'); } catch (e) { data = null; }

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (s) => { if (typeof s === 'number') return s; const t = String(s ?? '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return isNaN(n) ? null : n; };
  const brl = (n) => (n == null ? '—' : (n < 0 ? '-' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  const sgn = (s) => { const n = num(s); return n == null ? '' : n > 0 ? 'pos' : n < 0 ? 'neg' : ''; };
  const evClass = (s) => { const n = num(s); if (n == null) return ''; return n >= 2 ? 'pos' : n >= 0 ? 'mid' : 'neg'; };
  // ODD: sempre com 2 casas e vírgula ("1,10", nunca "1,1" nem "1.1"). Aceita número, "1,93" ou "1.93".
  const oddN = (s) => { if (typeof s === 'number') return s; const t = String(s ?? '').trim().replace(/^@/, ''); if (!t) return null; const n = parseFloat(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); return isNaN(n) || n <= 1 ? null : n; };
  const odd = (s) => { const n = oddN(s); return n == null ? '—' : n.toFixed(2).replace('.', ','); };
  const cap = (t) => { t = String(t || '').trim(); return t.charAt(0).toUpperCase() + t.slice(1); };

  // UM NOME SÓ PARA CADA COR (a cor vem pronta da planilha, aba Decisão; o app não decide nada)
  const tier = (j) => { const d = String(j.decisao || j.obs || j.cor || ''); return d.includes('🟢') ? 'g' : d.includes('🟡') ? 'a' : d.includes('🔴') ? 'r' : 'n'; };
  const NOME = { g: 'Proposta', a: 'Avaliar', r: 'Fora', n: 'Sem leitura' };
  const pill = (t, txt) => `<span class="pill ${t}"><span class="d ${t}"></span>${txt || NOME[t]}</span>`;

  // ================== HORÁRIO E "ATUALIZADO HÁ X" ==================
  // Os horários da planilha são de Brasília; o relógio usado aqui também, mesmo se o aparelho estiver em outro fuso.
  const agora = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
  function quando(s) {   // "26/11 14:07" ou "26/11/2026 14:57"
    const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\D+(\d{1,2}):(\d{2})/); if (!m) return null;
    const n = agora(), d = new Date(m[3] ? +m[3] : n.getFullYear(), +m[2] - 1, +m[1], +m[4], +m[5]);
    if (!m[3] && d - n > 30 * 864e5) d.setFullYear(d.getFullYear() - 1);
    return d;
  }
  const minDesde = (s) => { const d = quando(s); return d ? Math.max(0, Math.round((agora() - d) / 60000)) : null; };
  const ha = (m) => (m == null ? '' : m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m / 60)} h${m % 60 && m < 600 ? ' ' + String(m % 60).padStart(2, '0') : ''}` : `há ${Math.floor(m / 1440)} dia${m >= 2880 ? 's' : ''}`);
  const frescor = (m) => (m == null ? 'n' : m <= 30 ? 'g' : m <= 120 ? 'a' : 'r');   // só aviso visual: até 30 min, até 2 h, mais que 2 h
  const hhmm = (s) => { const m = String(s || '').match(/(\d{1,2}:\d{2})\s*$/); return m ? m[1] : String(s || ''); };

  // ORDEM PADRÃO DO APP (pedido do Adriano em 25/11): tudo pelo horário de início do jogo, do mais cedo ao mais tarde.
  const hmin = (h) => { const m = String(h || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : 9999; };
  const ordHora = (arr) => arr.map((x, i) => [x, i]).sort((a, b) => hmin(a[0].hora) - hmin(b[0].hora) || a[1] - b[1]).map((x) => x[0]);
  const porHora = (a, b) => hmin(a.j.hora) - hmin(b.j.hora) || String(a.j.jogo).localeCompare(String(b.j.jogo));
  const nrm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const ddmm = (d) => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  function diasInfo() {   // dia do mês -> { off, label } para hoje..+7
    const out = {}, sem = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], base = agora();
    for (let off = 0; off <= 7; off++) {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + off);
      const k = String(d.getDate()); if (out[k]) continue;
      out[k] = { off, label: off === 0 ? 'Hoje' : off === 1 ? 'Amanhã' : sem[d.getDay()] + ' ' + ddmm(d) };
    }
    return out;
  }
  // jogo já começou? (00:00 = virada da noite, ainda não começou). Dia que já passou conta como começado.
  function comecou(j) {
    const info = diasInfo()[String(j.dia)];
    if (!info) return true;
    if (info.off > 0) return false;
    const m = String(j.hora || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return false;
    if (+m[1] === 0 && +m[2] === 0) return false;
    const n = agora();
    return n.getHours() * 60 + n.getMinutes() >= +m[1] * 60 + +m[2];
  }

  // ================== MESMO JOGO COM NOME DIFERENTE ==================
  // "São Paulo FC x Clube do Remo" e "São Paulo x Remo" são o mesmo jogo: compara os times sem as palavras de enfeite.
  const ENFEITE = { fc: 1, cf: 1, sc: 1, ac: 1, afc: 1, ec: 1, se: 1, cd: 1, ca: 1, fk: 1, sk: 1, if: 1, bk: 1, clube: 1, club: 1, do: 1, de: 1, da: 1, the: 1 };
  const toks = (t) => nrm(t).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter((w) => w && !ENFEITE[w]);
  const contido = (a, b) => a.length > 0 && b.length > 0 && (a.every((w) => b.includes(w)) || b.every((w) => a.includes(w)));
  const mesmoTime = (a, b) => contido(toks(a), toks(b));
  const lados = (jogo) => { const p = String(jogo || '').split(/\s+x\s+/i); return p.length === 2 ? p : null; };
  function mesmoJogo(a, b) {
    if (a === b) return true;
    const x = lados(a), y = lados(b);
    return !!(x && y && mesmoTime(x[0], y[0]) && mesmoTime(x[1], y[1]));
  }

  // ================== DADOS ==================
  async function load(manual) {
    if (!KEY) { render(); return; }
    carregando = true; pintaSync();
    try {
      const r = await fetch(API_URL + '?k=' + encodeURIComponent(KEY) + '&_=' + Date.now(), { cache: 'no-store' });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || 'erro');
      data = j; offline = false; carregando = false;
      try { localStorage.setItem(LS.data, JSON.stringify(j)); localStorage.setItem(LS.at, String(Date.now())); } catch (e) {}
      render(true);
    } catch (e) {
      carregando = false; offline = true;
      if (String(e.message).includes('chave')) { KEY = ''; localStorage.removeItem(LS.key); }
      render(true);
      if (manual) toast('Não consegui atualizar. Mostrando a última leitura.');
    }
  }

  function futuros() {
    const out = [];
    (data && data.proximos || []).forEach((p, k) => (p.jogos || []).forEach((j) => out.push(Object.assign({}, j, { _futuro: true, dia: String(p.dia), _ord: k }))));
    return out;
  }
  // TODOS OS JOGOS: data.todos (aba Decisão inteira). Aposta, resultado e link vêm da aba do dia. Sem data.todos, cai para a aba do dia.
  let _todos = null;
  function todos() {
    if (_todos && _todos.src === data) return _todos.list;
    const hj = (data.hoje && data.hoje.jogos) || [], fut = futuros(), st = {};
    hj.forEach((j) => { st[String(data.dia) + '|' + j.jogo] = j; });
    fut.forEach((j) => { st[String(j.dia) + '|' + j.jogo] = j; });
    let rows, parcial = false;
    if (Array.isArray(data.todos)) {
      rows = data.todos.map((r) => {
        const o = Object.assign({}, r, { dia: String(r.dia) });
        const s0 = st[o.dia + '|' + o.jogo];
        if (s0) ['apostada', 'resultado', 'lucro', 'eventId', 'stake', 'clv', 'oddFech', 'lado', 'prob'].forEach((k) => { if (s0[k] != null && s0[k] !== '') o[k] = s0[k]; });
        if (!o.odd && o.oddDG) o.odd = o.oddDG;
        return o;
      });
    } else {
      rows = hj.map((j) => Object.assign({}, j, { dia: String(data.dia) })).concat(fut); parcial = true;
    }
    _todos = { src: data, list: rows, parcial };
    return rows;
  }
  const doDia = (dia) => todos().map((j, i) => ({ j, i })).filter((x) => x.j.dia === String(dia)).sort(porHora);
  function acha(dia, jogo, hora) {   // linha da Decisão para um jogo citado em outro lugar (Report, conferência)
    const l = todos();
    for (let i = 0; i < l.length; i++) if (l[i].dia === String(dia) && l[i].jogo === jogo) return { j: l[i], i };
    for (let i = 0; i < l.length; i++) if (l[i].dia === String(dia) && (!hora || !l[i].hora || l[i].hora === hora) && mesmoJogo(l[i].jogo, jogo)) return { j: l[i], i };
    return null;
  }

  // ================== A ENTRADA, ESCRITA COMO NA CASA ==================
  const entrada = (j) => (j.favorito ? `${j.favorito} vence` : '—');
  const MERCADO = 'Resultado final';
  const casaDe = (j) => j.casa || j.casaOdd || '';
  const PM = 'https://parimatch-hub.bet';
  const linkAposta = (j) => (j.eventId ? PM + '/pt/events/x-' + encodeURIComponent(j.eventId) : PM + '/pt/sports/football');
  const ehPM = (j) => !casaDe(j) || /parimatch/i.test(casaDe(j));
  // sugestão do gerador: "menos de 4,5 gols (84% · 1.16)" -> entrada, chance e odd de referência
  function sugestao(txt) {
    const s = String(txt || '').trim(); if (!s) return null;
    const m = s.match(/^(.*?)\s*\((\d+(?:[.,]\d+)?)\s*%\s*·\s*@?([\d.,]+)\)\s*$/);
    const o = m ? { txt: cap(m[1]), chance: m[2].replace('.', ',') + '%', odd: oddN(m[3]) } : { txt: cap(s), chance: '', odd: null };
    o.teste = /escanteio|cart[aãoõ]/i.test(o.txt);   // escanteios e cartões: só medição até liberar
    return o;
  }
  // perna de múltipla: "Stoke City marca gol (1,23)" -> texto e odd da perna
  function perna(txt) {
    const s = String(txt || '').trim(), m = s.match(/^(.*?)\s*\(@?(\d+[.,]\d+)\)\s*$/);
    return m ? { txt: m[1], odd: oddN(m[2]) } : { txt: s, odd: null };
  }

  // ================== RESULTADO LIGADO À PROPOSTA ==================
  // Placar: conferência do robô (data.report.conferencia). O app só compara o placar com a entrada "favorito vence".
  let _conf = null;
  function confDe(j) {
    const c = data.report && data.report.conferencia;
    if (!c || !(c.dias || []).length) return null;
    if (!_conf || _conf.src !== data) _conf = { src: data, m: new Map() };
    const k = j.dia + '|' + j.jogo;
    if (_conf.m.has(k)) return _conf.m.get(k);
    let out = null;
    for (const d of c.dias) {
      if (String(parseInt(d.dia, 10)) !== String(j.dia)) continue;
      out = (d.jogos || []).find((x) => x.jogo === j.jogo) || (d.jogos || []).find((x) => (!x.hora || !j.hora || x.hora === j.hora) && mesmoJogo(x.jogo, j.jogo)) || null;
      if (out) break;
    }
    _conf.m.set(k, out); return out;
  }
  function resultado(j) {   // { placar, r: 'v' venceu | 'e' empatou | 'd' perdeu } do favorito
    const c = confDe(j), m = c && String(c.placar || '').match(/(\d+)\s*x\s*(\d+)/);
    if (!m) return null;
    const p = lados(j.jogo); let lado = /^fora/i.test(String(j.lado || '')) ? 'f' : /^casa/i.test(String(j.lado || '')) ? 'c' : null;
    if (!lado && p && j.favorito) { const c1 = mesmoTime(j.favorito, p[0]), f1 = mesmoTime(j.favorito, p[1]); lado = c1 && !f1 ? 'c' : f1 && !c1 ? 'f' : null; }
    if (!lado) return { placar: c.placar, r: null };
    const gf = lado === 'c' ? +m[1] : +m[2], gc = lado === 'c' ? +m[2] : +m[1];
    return { placar: c.placar, r: gf > gc ? 'v' : gf === gc ? 'e' : 'd' };
  }
  const RTXT = { v: 'venceu', e: 'empatou', d: 'perdeu' };
  // frase do resultado conforme a cor: proposta que venceu = acertou; "Fora" em que o favorito não venceu = acertou ao ficar fora
  function veredito(j) {
    const r = resultado(j); if (!r) return null;
    const t = tier(j); let ok = null, txt = '';
    if (r.r) {
      if (t === 'g' || t === 'a') { ok = r.r === 'v'; txt = ok ? `${NOME[t]} acertou: ${j.favorito} venceu` : `${NOME[t]} errou: ${j.favorito} ${RTXT[r.r]}`; }
      else if (t === 'r') { ok = r.r !== 'v'; txt = ok ? `Fora acertou: ${j.favorito} ${RTXT[r.r]}` : `Fora errou: ${j.favorito} venceu`; }
      else txt = `${j.favorito} ${RTXT[r.r]}`;
    }
    return { placar: r.placar, ok, txt, t };
  }
  function linhaVeredito(j) {
    const v = veredito(j);
    if (!v) return (j.resultado ? `<div class="vd"><span class="res ${esc(j.resultado)}">${esc(j.resultado)}</span>${j.lucro ? ' ' + esc(j.lucro) : ''}</div>` : '');
    return `<div class="vd ${v.ok === true ? 'ok' : v.ok === false ? 'no' : ''}"><b>${v.ok === true ? '✅' : v.ok === false ? '❌' : '➖'} ${esc(v.txt || 'Jogo encerrado')}</b><span class="placar">${esc(v.placar)}</span></div>`;
  }
  function placarCores(dia) {   // acertos do dia por cor, só dos jogos que o robô já conferiu
    const c = { g: [0, 0], a: [0, 0], r: [0, 0] };
    doDia(dia).forEach(({ j }) => { const v = veredito(j); if (v && v.ok != null && c[v.t]) c[v.t][v.ok ? 0 : 1]++; });
    return c;
  }
  function blocoPlacarCores() {
    const c = placarCores(data.dia), tot = c.g[0] + c.g[1] + c.a[0] + c.a[1] + c.r[0] + c.r[1];
    if (!tot) return '';
    const t = (k, l) => `<div class="tile"><div class="l"><span class="d ${k}"></span>${l}</div><div class="v sm">✅ ${c[k][0]} · ❌ ${c[k][1]}</div></div>`;
    return `<div class="sec"><h2>Placar de hoje por cor</h2><span>${tot} jogo(s) conferido(s)</span></div>
      <div class="tiles">${t('g', 'Propostas')}${t('a', 'Avaliar')}${t('r', 'Fora')}</div>
      <p class="note" style="margin:-6px 4px 12px">Proposta e Avaliar acertam quando o favorito vence. Fora acerta quando o favorito não vence. Só medição.</p>`;
  }

  // ================== RAIO-X DOS TIMES (últimos 5, tabela, chance pela odd x o que o time fez) ==================
  // Só informação: não muda cor nem decisão. Lê j.raio quando a planilha mandar:
  //   raio: { casa: { ult5: 'VVEDV', pos: 3, v10: 5, e10: 3, d10: 2, n10: 10 }, fora: { ... },
  //           prob: { c: 52, e: 26, f: 22, fonte: 'Pinnacle sem margem' }, odds: { c: 1.90, e: 3.40, f: 4.20 } }
  // Enquanto não manda, mostra o que já existe para o favorito (forma e % de vitórias que vêm no texto da decisão) e "—" no resto.
  const pc = (n) => (n == null || isNaN(n) ? '—' : Math.round(n) + '%');
  function raio(j) {
    const r = j.raio || {}, p = lados(j.jogo) || ['Casa', 'Fora'], out = { casa: Object.assign({ nome: p[0] }, r.casa), fora: Object.assign({ nome: p[1] }, r.fora), prob: Object.assign({}, r.prob), completo: !!j.raio };
    if (r.odds && out.prob.c == null) {   // sem probabilidade pronta: tira a margem das 3 odds
      const a = [oddN(r.odds.c), oddN(r.odds.e), oddN(r.odds.f)];
      if (a.every(Boolean)) { const s = a.reduce((t, o) => t + 1 / o, 0); out.prob = { c: 100 / a[0] / s, e: 100 / a[1] / s, f: 100 / a[2] / s, fonte: r.odds.fonte || 'odds sem a margem' }; }
    }
    // o que dá para saber hoje, só do favorito
    const lf = /^fora/i.test(String(j.lado || '')) ? 'fora' : /^casa/i.test(String(j.lado || '')) ? 'casa' : (j.favorito && mesmoTime(j.favorito, p[1]) && !mesmoTime(j.favorito, p[0])) ? 'fora' : (j.favorito && mesmoTime(j.favorito, p[0])) ? 'casa' : null;
    out.fav = lf;
    if (lf) {
      const t = String(j.aFavor || '') + ' • ' + String(j.contra || ''), f = out[lf], k = lf === 'casa' ? 'c' : 'f';
      const m1 = t.match(/Forma:\s*(\d+) de (\d+) pontos nos últimos (\d+) jogos/i); if (m1 && !f.ult5) f.pts = `${m1[1]} de ${m1[2]} pts`;
      const m2 = t.match(/vence (\d+)% dos jogos vs (\d+)% esperado pelo preço/i); if (m2) { if (f.v10 == null) f.vencePct = +m2[1]; if (out.prob[k] == null) { out.prob[k] = +m2[2]; out.prob.fonte = out.prob.fonte || 'referência da decisão'; } }
      if (out.prob[k] == null) { const j0 = oddN(j.oddJusta), o = oddN(j.odd); if (j0) { out.prob[k] = 100 / j0; out.prob.fonte = 'odd justa'; } else if (o) { out.prob[k] = 100 / o; out.prob.fonte = 'odd da casa, com margem'; } }
    }
    ['casa', 'fora'].forEach((s) => { const f = out[s]; if (f.n10 && f.v10 != null) f.vencePct = f.v10 / f.n10 * 100; if (f.n10 && f.e10 != null) f.empPct = f.e10 / f.n10 * 100; });
    return out;
  }
  const bolas = (s) => (s ? '<span class="u5">' + String(s).toUpperCase().replace(/[^VEDWL]/g, '').slice(0, 5).split('').map((c) => `<i class="${c === 'V' || c === 'W' ? 'g' : c === 'E' ? 'a' : 'r'}" title="${c === 'V' || c === 'W' ? 'vitória' : c === 'E' ? 'empate' : 'derrota'}"></i>`).join('') + '</span>' : '');
  // comparação: o que a odd diz x o que o time fez. Diferença de 10 pontos ou mais ganha cor (só destaque visual).
  const difCls = (odd, fez) => (odd == null || fez == null ? '' : fez - odd >= 10 ? 'pos' : odd - fez >= 10 ? 'neg' : '');
  function raioLinhas(j) {   // versão curta, para a lista de jogos
    const r = raio(j), l = (f, p) => `<div class="rx"><span class="rn">${esc(f.nome)}</span>${bolas(f.ult5) || (f.pts ? `<span class="meta">${esc(f.pts)}</span>` : '<span class="meta">—</span>')}<span class="meta">${f.pos ? f.pos + 'º' : ''}</span><span class="rp">· odd diz ${pc(p)} · venceu <b class="${difCls(p, f.vencePct)}">${pc(f.vencePct)}</b></span></div>`;
    if (!r.completo && !r.fav) return '';
    if (!r.completo) return l(r[r.fav], r.prob[r.fav === 'casa' ? 'c' : 'f']);
    return l(r.casa, r.prob.c) + l(r.fora, r.prob.f) + (r.prob.e != null ? `<div class="rx"><span class="meta">Casa ${pc(r.prob.c)} · Empate ${pc(r.prob.e)} · Fora ${pc(r.prob.f)}${r.prob.fonte ? ' · ' + esc(r.prob.fonte) : ''}</span></div>` : '');
  }
  function raioTabela(j) {   // versão completa, na ficha do jogo
    const r = raio(j), emp = (r.casa.empPct != null && r.fora.empPct != null) ? (r.casa.empPct + r.fora.empPct) / 2 : null;
    const tr = (nome, f, p, fez) => `<tr><td><b>${esc(nome)}</b></td><td>${f ? (bolas(f.ult5) || esc(f.pts || '—')) : ''}</td><td>${f ? (f.pos ? f.pos + 'º' : '—') : ''}</td><td>${pc(p)}</td><td class="${difCls(p, fez)}"><b>${pc(fez)}</b></td></tr>`;
    return `<div class="p"><b>Raio-X dos times</b></div><table class="rxt"><tr><th></th><th>Últimos 5</th><th>Tabela</th><th>Odd diz</th><th>Fez</th></tr>
      ${tr(r.casa.nome + ' vence', r.casa, r.prob.c, r.casa.vencePct)}${tr('Empate', null, r.prob.e, emp)}${tr(r.fora.nome + ' vence', r.fora, r.prob.f, r.fora.vencePct)}</table>
      <div class="note" style="margin-top:6px"><span class="u5"><i class="g"></i></span> vitória <span class="u5"><i class="a"></i></span> empate <span class="u5"><i class="r"></i></span> derrota · "Odd diz": chance pelo preço${r.prob.fonte ? ' (' + esc(r.prob.fonte) + ')' : ''}. "Fez": quanto o time venceu nos últimos jogos. Amostra pequena, só informação. — = a planilha ainda não manda esse dado.</div>`;
  }

  // ================== SELO "ATUALIZADO" ==================
  // A hora que vale é a da última leitura das decisões (coluna "atualizado" da aba Decisão), não a hora em que o app abriu.
  function idadeDecisoes() {
    const l = todos().filter((j) => j.atualizado);
    const vivos = l.filter((j) => !comecou(j));
    const base = vivos.length ? vivos : l;
    let novo = null, velho = null;
    base.forEach((j) => { const m = minDesde(j.atualizado); if (m == null) return; if (novo == null || m < novo) novo = m; if (velho == null || m > velho) velho = m; });
    return { novo, velho, n: base.length };
  }
  function pintaSync() {
    const sy = $('#sync'), st = $('#synctxt');
    sy.className = 'sync';
    if (carregando) { sy.classList.add('loading'); st.textContent = 'atualizando…'; return; }
    if (!data) { sy.classList.add('off'); st.textContent = offline ? 'sem conexão' : '—'; return; }
    const i = idadeDecisoes(), m = i.novo != null ? i.novo : minDesde(data.geradoEm);
    sy.classList.add('f' + frescor(m)); if (offline) sy.classList.add('off');
    st.textContent = (offline ? 'sem conexão · ' : '') + 'dados ' + (ha(m) || '—');
  }
  function blocoAtualizacao() {
    const i = idadeDecisoes(), r = data.report || {}, c = r.conferencia || {}, ia = r.ia || {};
    const lin = (nome, quandoTxt, extra) => { const m = minDesde(quandoTxt); return quandoTxt ? `<div class="up"><span class="d ${frescor(m)}"></span><div><b>${nome}</b> ${esc(hhmm(quandoTxt))} <span class="meta">· ${ha(m)}${extra ? ' · ' + extra : ''}</span></div></div>` : ''; };
    const dec = i.novo != null ? `<div class="up"><span class="d ${frescor(i.novo)}"></span><div><b>Decisões e odds</b> <span class="meta">mais nova ${ha(i.novo)}${i.velho != null && i.velho !== i.novo ? ' · mais antiga ' + ha(i.velho) : ''}</span></div></div>` : '';
    return `<details class="card upbox"><summary><span class="d ${frescor(i.novo)}"></span> <b>O que está atualizado</b> <span class="meta">· decisões ${ha(i.novo) || 'sem horário'}</span></summary>
      ${dec}${lin('Análise do dia', r.geradoEm)}${lin('Notícias', ia.atualizado)}${lin('Conferência', c.atualizado)}${lin('Aba do dia', data.hoje && data.hoje.kpi && data.hoje.kpi['ÚLTIMA ATUALIZAÇÃO'])}${lin('App buscou na planilha', data.geradoEm, offline ? 'sem conexão agora' : '')}
      <p class="note" style="margin:8px 0 0">Verde: até 30 min. Amarelo: até 2 h. Vermelho: mais de 2 h, confira a odd na casa antes de apostar.</p></details>`;
  }
  const lido = (j) => { const m = minDesde(j.atualizado); return j.atualizado ? `<span class="lido f${frescor(m)}">odd lida ${esc(hhmm(j.atualizado))} · ${ha(m)}${frescor(m) === 'r' && !comecou(j) ? ' · confira na casa' : ''}</span>` : ''; };

  // ================== FICHA DA PROPOSTA ==================
  const icoBet = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
  const icoShare = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
  const motivo = (j) => { if (j.motivo) return String(j.motivo); const d = String(j.decisao || j.obs || ''); const m = d.split('·'); return m.length > 1 ? m.slice(1).join('·').replace(/·\s*critérios.*$/, '').trim() : ''; };
  const diaLabel = (j) => { const i = diasInfo()[String(j.dia)]; return i && i.off > 0 ? i.label + ' · ' : ''; };
  function textoEntrada(j) {
    return `⚽ ${j.jogo} · ${diaLabel(j)}${j.hora}${j.liga ? ' · ' + j.liga : ''}\n` +
      `${tier(j) === 'g' ? '✅ Proposta' : tier(j) === 'a' ? '🟡 Para avaliar' : 'ℹ️'}: ${entrada(j)} @${odd(j.odd)}${casaDe(j) ? ' (' + casaDe(j) + ')' : ''}\n` +
      `${MERCADO} · stake ${STAKE}` + (ehPM(j) && j.eventId ? `\n👉 ${linkAposta(j)}` : '');
  }
  function ficha(j, i, extra) {
    const t = tier(j), aberto = !comecou(j) && !j.resultado;
    return `<div class="pc ${t}">
      <div class="row"><div class="meta">${diaLabel(j)}<b class="hr">${esc(j.hora)}</b> · ${esc(j.liga)}</div>${j.apostada ? '<span class="pill b">você apostou</span>' : pill(t, extra)}</div>
      <div class="jg">${esc(j.jogo)}</div>
      <div class="ent"><div><div class="k">ENTRADA</div><div class="e">${esc(entrada(j))}</div><div class="k2">${MERCADO} · ${esc(casaDe(j) || 'casa da DG')} · stake ${STAKE}</div></div>
        <div class="ob"><div class="k">ODD</div><div class="o">${odd(j.odd)}</div></div></div>
      <div class="vline${/^valor/i.test(motivo(j)) ? ' hidden' : ''}">${j.valor ? `<span>Valor <b class="${evClass(j.valor)}">${esc(j.valor)}</b></span>` : ''}${j.nota ? `<span>Nota <b>${esc(j.nota)}</b></span>` : ''}${j.oddJusta ? `<span>Justa <b>${odd(j.oddJusta)}</b></span>` : ''}</div>
      ${motivo(j) ? `<div class="mot">${esc(motivo(j))}</div>` : ''}
      ${aberto ? `<div class="vsub">${lido(j)}</div>` : linhaVeredito(j) || '<div class="vsub">Jogo começou. Resultado ainda não conferido.</div>'}
      <div class="acts">
        ${aberto && ehPM(j) ? `<a class="a-bet ${t}" href="${esc(linkAposta(j))}" target="_blank" rel="noopener">${icoBet}Abrir na Parimatch</a>` : `<button type="button" class="a-share" data-z="${i}">Ver ficha completa</button>`}
        <button type="button" class="a-share" data-share="${i}" aria-label="Compartilhar">${icoShare}</button>
        ${aberto && ehPM(j) ? `<button type="button" class="a-info" data-z="${i}">Ficha</button>` : ''}
      </div></div>`;
  }
  const sec = (t, s) => `<div class="sec"><h2>${t}</h2><span>${s || ''}</span></div>`;

  // Sugestões do gerador (Report do dia): observação, não é proposta. Um item por jogo; nomes duplicados são unidos.
  function repJogos() {   // jogos do report sem duplicata, com a cor da Decisão (uma fonte só para a cor)
    const r = data.report; if (!r || !(r.jogos || []).length) return [];
    const out = [];
    ordHora(r.jogos).forEach((b) => {
      const a = acha(r.dia, b.jogo, b.hora);
      const ja = out.find((x) => (a && x.z && x.z.i === a.i) || (!a && x.b.jogo === b.jogo));
      if (ja) { (b.fatos || []).forEach((f) => { if (!ja.fatos.some((g) => g.txt === f.txt && g.time === f.time)) ja.fatos.push(f); }); if (!ja.aposta && b.aposta) ja.aposta = b.aposta; return; }
      out.push({ b, z: a, fatos: (b.fatos || []).slice(), aposta: b.aposta, nome: a ? a.j.jogo : b.jogo, t: a ? tier(a.j) : tier(b), j: a ? a.j : { dia: String(r.dia), hora: b.hora, jogo: b.jogo } });
    });
    return out;
  }
  function blocoObservacao() {
    const itens = [];
    repJogos().forEach((x) => {
      if (comecou(x.j)) return;
      const s = sugestao(x.aposta); if (s) itens.push({ x, s });
      x.fatos.filter((f) => (f.tipo === 'escanteios' || f.tipo === 'cartões') && f.selo === 'ajuda').forEach((f) => itens.push({ x, s: { txt: cap(String(f.txt).split(':')[0]), det: String(f.txt).split(':').slice(1).join(':').trim(), chance: '', odd: null, teste: true, ico: f.icone } }));
    });
    if (!itens.length) return '';
    return `<details class="grp"><summary>${sec('Observação: não é proposta', itens.length + ' · toque para abrir')}</summary>
      <p class="note" style="margin:0 4px 8px">Sugestões do gerador pelos números dos times. A odd é de referência: confira na casa. Escanteios e cartões estão <b>em teste</b> (só medindo, sem apostar).</p>
      ${itens.map(({ x, s }) => `<div class="gr n"${x.z ? ` data-z="${x.z.i}"` : ''}><div class="gt">${esc(x.j.hora)}</div>
        <div class="gm"><div class="gj">${s.ico ? esc(s.ico) + ' ' : ''}${esc(s.txt)}</div><div class="gs">${esc(x.nome)}${s.chance ? ' · chance ' + esc(s.chance) : ''}</div>${s.det ? `<div class="gx">${esc(s.det)}</div>` : ''}</div>
        <div class="gv">${s.odd ? `<div class="on">${odd(s.odd)}</div><div class="k">odd ref.</div>` : ''}<span class="tag ${s.teste ? 't' : ''}">${s.teste ? 'em teste' : 'observação'}</span></div></div>`).join('')}</details>`;
  }
  // Favoritos fortes sem valor: lista à parte (data.report.fortes). Não é entrada de valor e nunca aparece como verde.
  function blocoFortes() {
    const r = data.report, fs = (r && String(r.dia) === String(data.dia) && r.fortes) || [];
    if (!fs.length) return '';
    let h = sec('Sem valor: favorito forte, preço ruim', fs.length) + `<p class="note" style="margin:0 4px 8px">Tendência forte de vitória, mas a odd paga menos que o justo. Não são propostas. "Custo" é a perda média a cada R$ 100.</p>`;
    ordHora(fs).forEach((f) => {
      h += `<div class="gr n"><div class="gt">${esc(f.hora)}</div>
        <div class="gm"><div class="gj">${esc(f.favorito)} vence${f.visitante ? ' (visitante)' : ''}</div><div class="gs">${esc(f.jogo)} · ${esc(f.liga)}${f.casa ? ' · ' + esc(f.casa) : ''}</div>

          <div class="gx">${esc((f.motivos || []).join(' · '))}</div></div>
        <div class="gv"><div class="on">${odd(f.odd)}</div><div class="k">odd</div><span class="tag">sem valor</span></div></div>`;

  }

  // ================== TELA APOSTAR ==================
  function viewApostar() {
    const hj = doDia(data.dia), info = diasInfo();
    if (!hj.length && !(data.hoje && data.hoje.existe)) return blocoAtualizacao() + '<div class="empty">Ainda não há jogos de hoje na planilha.<br>A aba do dia nasce às 22h do dia anterior.</div>';
    const fora = (j) => !!j.resultado || comecou(j);
    const ab = hj.filter((x) => !fora(x.j));
    const props = ab.filter((x) => tier(x.j) === 'g'), aval = ab.filter((x) => tier(x.j) === 'a');
    const espera = ab.filter((x) => tier(x.j) === 'r' && /esperar preço|só se pagar|se subir para|entra só se/i.test(String(x.j.decisao || '') + ' ' + motivo(x.j)));
    const passados = hj.filter((x) => fora(x.j) && (tier(x.j) === 'g' || tier(x.j) === 'a'));
    const fut = todos().map((j, i) => ({ j, i })).filter((x) => info[x.j.dia] && info[x.j.dia].off > 0 && (tier(x.j) === 'g' || tier(x.j) === 'a')).sort((a, b) => info[a.j.dia].off - info[b.j.dia].off || porHora(a, b));
    let h = props.length
      ? `<div class="hero"><div><div class="t">${props.length} proposta${props.length > 1 ? 's' : ''} para apostar agora</div><div class="s">${aval.length ? aval.length + ' para avaliar · ' : ''}${ab.length} jogo(s) de hoje ainda por começar</div></div><button type="button" data-shareall="1">Enviar</button></div>`
      : `<div class="hero none"><div><div class="t">Nenhuma proposta para apostar agora</div><div class="s">${aval.length ? aval.length + ' jogo(s) para avaliar. ' : ''}${ab.length} de ${hj.length} jogos de hoje ainda por começar.</div></div></div>`;
    h += blocoAtualizacao();
    h += sec('<span class="d g"></span> Propostas para apostar', props.length + ' · verde · stake ' + STAKE);
    h += props.length ? props.map((x) => ficha(x.j, x.i)).join('') : '<div class="empty sm">Nenhum jogo verde por começar hoje.</div>';
    if (aval.length) h += sec('<span class="d a"></span> Para avaliar', aval.length + ' · amarelo · você decide') + aval.map((x) => ficha(x.j, x.i)).join('');
    if (espera.length) h += sec('<span class="d r"></span> Esperando preço', 'fora por preço: só se a odd subir') + espera.map((x) => ficha(x.j, x.i, 'Fora por preço')).join('');
    if (fut.length) h += sec('Próximos dias', fut.length + ' já com cor') + fut.map((x) => ficha(x.j, x.i)).join('');
    h += blocoObservacao();
    h += blocoFortes();

    h += blocoPlacarCores();
    const cc = { g: 0, a: 0, r: 0, n: 0 }; hj.forEach((x) => { cc[tier(x.j)]++; });
    h += sec('Todos os jogos de hoje', hj.length + ' analisados');
    h += `<div class="tiles four">${['g', 'a', 'r', 'n'].map((k) => `<div class="tile"><div class="l"><span class="d ${k}"></span>${NOME[k]}</div><div class="v">${cc[k]}</div></div>`).join('')}</div>`;
    h += `<button class="btn ghost" type="button" data-gotab="jogos">Ver todos os jogos</button>`;
    return h;
  }

  // ================== TELA MÚLTIPLAS ==================
  // Vêm da aba do dia (data.hoje.multiplas). O resultado de cada perna vem da conferência do robô.
  function horaMultipla(m) {   // primeiro jogo da múltipla: menor horário entre os jogos de hoje citados nas pernas
    const txt = ' ' + nrm((m.lista && m.lista.length ? m.lista.join(' + ') : m.pernas) || '').replace(/[^a-z0-9]+/g, ' ') + ' ';
    let best = 9999, hora = '';
    doDia(data.dia).forEach(({ j }) => {
      const times = String(j.jogo || '').split(/\s+x\s+/i).concat(j.favorito ? [j.favorito] : []);
      const bate = times.some((t) => { const k = toks(t).join(' '); if (!k) return false; if (txt.includes(' ' + k + ' ')) return true; return k.split(' ').some((w) => w.length >= 5 && txt.includes(' ' + w + ' ')); });
      if (bate && hmin(j.hora) < best) { best = hmin(j.hora); hora = j.hora; }
    });
    return hora;
  }
  function confMultiplas() {   // { 'dd/mm': { n: { pernas:[item], inteira:item } } } a partir da conferência
    const out = {}, c = data.report && data.report.conferencia;
    ((c && c.dias) || []).forEach((d) => (d.jogos || []).forEach((jg) => (jg.itens || []).forEach((it) => {
      const m = String(it.origem || '').match(/^M[úu]ltipla\s*(\d+)/i); if (!m) return;
      const o = ((out[d.dia] = out[d.dia] || {})[m[1]] = out[d.dia][m[1]] || { pernas: [], inteira: null });
      if (/inteira/i.test(it.tipo || '')) o.inteira = Object.assign({ jogo: jg.jogo, placar: jg.placar }, it); else o.pernas.push(Object.assign({ jogo: jg.jogo, placar: jg.placar, hora: jg.hora }, it));
    })));
    return out;
  }
  const resIco = (r) => (r === '✅' || r === '❌' ? r : '➖');
  function viewMultiplas() {
    const ms = (data.hoje && data.hoje.multiplas) || [], cm = confMultiplas(), c = data.report && data.report.conferencia;
    const hojeK = Object.keys(cm).find((k) => String(parseInt(k, 10)) === String(data.dia));
    const lst = ms.map((m, i) => ({ m, i, h: horaMultipla(m) })).sort((a, b) => hmin(a.h) - hmin(b.h) || a.i - b.i);
    const nowM = agora().getHours() * 60 + agora().getMinutes();
    const ab = lst.filter((x) => !x.m.resultado && !(x.h && hmin(x.h) <= nowM));
    let h = ab.length
      ? `<div class="hero"><div><div class="t">${ab.length} múltipla${ab.length > 1 ? 's' : ''} aberta${ab.length > 1 ? 's' : ''} para hoje</div><div class="s">Stake ${STAKE} cada. Monte na casa com as entradas abaixo.</div></div></div>`
      : `<div class="hero none"><div><div class="t">Nenhuma múltipla aberta agora</div><div class="s">${ms.length ? ms.length + ' de hoje já começaram ou terminaram.' : 'Só entra múltipla com a conta a favor. Em dia fraco vem uma ou nenhuma.'}</div></div></div>`;
    const card = ({ m, h: h1 }) => {
      const pn = (m.lista && m.lista.length ? m.lista : String(m.pernas || '').split(' + ')).map(perna);
      const cf = hojeK && cm[hojeK][String(parseInt(String(m.n).replace(/\D/g, ''), 10))];
      const achaP = (p) => cf && cf.pernas.find((it) => { const a = nrm(it.txt), b = nrm(p.txt); return a.startsWith(b) || b.startsWith(nrm(it.confere || '\u0000')) || a.includes(b); });
      const st = num(m.stake) || 100, o = oddN(m.odd);
      const comec = h1 && hmin(h1) <= nowM;
      return `<div class="pc ${m.resultado ? 'n' : 'b'}"><div class="row"><div class="meta">Múltipla ${esc(m.n)}${h1 ? ' · 1º jogo <b class="hr">' + esc(h1) + '</b>' : ''}</div>
        ${m.resultado ? `<span class="res ${esc(m.resultado)}">${esc(m.resultado)}</span>` : m.apostada ? '<span class="pill b">você apostou</span>' : comec ? '<span class="pill n">já começou</span>' : '<span class="pill b">aberta</span>'}</div>
        <div class="pernas">${pn.map((p, k) => { const it = achaP(p); return `<div class="pn"><span class="pi">${it ? resIco(it.res) : k + 1}</span><div class="pt">${esc(cap(p.txt))}${it && it.det ? `<div class="k2">${esc(it.jogo)} ${esc(it.placar || '')} · ${esc(it.det)}</div>` : ''}</div><span class="po">${p.odd ? odd(p.odd) : ''}</span></div>`; }).join('')}</div>
        <div class="ent"><div><div class="k">${pn.length} ENTRADAS NA MESMA APOSTA</div><div class="k2">Stake ${esc(m.stake || STAKE)}${o ? ' · retorno ' + brl(st * o) : ''}${m.prob ? ' · chance ' + esc(m.prob) : ''}${m.ev ? ' · EV ' + esc(m.ev) : ''}</div></div>
          <div class="ob"><div class="k">ODD TOTAL</div><div class="o">${odd(m.odd)}</div></div></div>
        ${cf && cf.inteira ? `<div class="vd ${cf.inteira.res === '✅' ? 'ok' : cf.inteira.res === '❌' ? 'no' : ''}"><b>${resIco(cf.inteira.res)} Múltipla ${cf.inteira.res === '✅' ? 'acertou' : cf.inteira.res === '❌' ? 'errou' : 'sem conferência'}</b><span class="placar">${esc(cf.inteira.det || '')}</span></div>` : ''}

    const ant = Object.keys(cm).filter((k) => k !== hojeK || !ms.length);
    if (ant.length) {
      h += sec('Múltiplas conferidas', 'resultado de cada entrada');
      ant.forEach((dk) => Object.keys(cm[dk]).sort((a, b) => a - b).forEach((n) => {
        const o = cm[dk][n], ok = o.pernas.filter((p) => p.res === '✅').length, x = o.pernas.filter((p) => p.res === '❌').length;
        const r = o.inteira ? o.inteira.res : (x ? '❌' : ok === o.pernas.length && ok ? '✅' : '➖');
        h += `<div class="pc n"><div class="row"><div class="meta">Dia ${esc(dk)} · Múltipla ${esc(n)}</div><span class="pill ${r === '✅' ? 'g' : r === '❌' ? 'r' : 'n'}">${r === '✅' ? '✅ acertou' : r === '❌' ? '❌ errou' : 'sem resultado'}</span></div>

    return h + '<p class="note" style="margin:6px 4px 14px">A mesma aposta não repete entre múltiplas. Jogos e odds da lista da DG; confira a odd na casa.</p>';
  }

  // ================== TELA JOGOS ==================

  function pintaJogos() {

    const apo = base.filter((x) => x.j.apostada).length;

    const lista = base.filter((x) => Z.cor === 'all' || (Z.cor === 'apo' ? x.j.apostada : tier(x.j) === Z.cor)).sort(porHora);
    $('#zlista').innerHTML = lista.length ? lista.map(({ j, i }) => {

          ${v ? `<div class="gx ${v.ok === true ? 'pos' : v.ok === false ? 'neg' : ''}" style="font-weight:700">${v.ok === true ? '✅' : v.ok === false ? '❌' : '➖'} ${esc(v.placar)} · ${esc(v.txt)}</div>` : mot ? `<div class="gx">${esc(mot)}</div>` : ''}
          ${raioLinhas(j)}
          <div class="gx">${(v || !/^valor/i.test(mot)) && j.valor ? 'valor ' + esc(j.valor) + ' · ' : ''}${(v || !/^valor/i.test(mot)) && j.nota ? 'nota ' + esc(j.nota) + ' · ' : ''}${j.atualizado ? 'odd lida ' + esc(hhmm(j.atualizado)) : ''}</div></div>
        <div class="gv"><div class="on">${odd(j.odd)}</div><div class="k">odd</div>${pill(t)}
          ${j.apostada ? '<div class="k" style="color:var(--blue)">apostada</div>' : ''}${off && !v ? '<div><span class="tag">já começou</span></div>' : ''}</div></div>`;
    }).join('') : '<div class="empty">Nenhum jogo com esse filtro.</div>';
  }

  // ================== TELA ANÁLISE (Report do dia + acertos) ==================
  let repFiltro = 'todos';
  const repTipos = [['todos', 'Tudo'], ['sequência', '🔥 Sequência'], ['gols', '⚽ Gols'], ['escanteios', '🚩 Escanteios'], ['cartões', '🟨 Cartões'], ['desfalques', '🏥 Desfalques'], ['má fase', '⚠️ Má fase'], ['aposta', '🎯 Com sugestão'], ['ajuda', '✅ Testado']];
  const repPassa = (f) => repFiltro === 'todos' || (repFiltro === 'aposta' ? !!f.aposta : repFiltro === 'ajuda' ? f.selo === 'ajuda' : f.tipo === repFiltro);
  const repForca = (n) => (n >= 15 ? ['r', 'muito forte'] : n >= 13 ? ['a', 'forte'] : ['n', 'médio']);
  const repFrase = (f) => (f.time ? `<b>${esc(f.time)}</b> ${esc(f.txt)}` : esc(cap(f.txt)));
  const repSelo = (f) => (f.selo === 'ajuda' ? '<span style="color:var(--green)">✅ testado: ajuda</span>' : f.selo === 'na odd' ? '<span>⚖️ já está na odd</span>' : '');
  const repHist = (f) => (f.hist || repSelo(f) ? `<div class="gx" style="-webkit-line-clamp:3">${repSelo(f)}${f.hist ? `${repSelo(f) ? ' · ' : ''}${esc(f.hist)}` : ''}</div>` : '');
  function sugLinha(txt, rot) {   // a sugestão em destaque: entrada, odd de referência e etiqueta
    const s = sugestao(txt); if (!s) return '';

  const cfCor = (res) => (res === '✅' ? 'var(--green)' : res === '❌' ? 'var(--red)' : 'inherit');
  const cfPct = (o) => (o.pct === null || o.pct === undefined ? '' : ` · ${o.pct}% de acerto`);
  function blocoConferencia() {
    const c = data.report && data.report.conferencia;
    if (!c || !(c.dias || []).length) return '<div class="empty sm">A conferência ainda não rodou.</div>';
    let h = sec('Conferência das informações', 'atualizada ' + esc(hhmm(c.atualizado)) + ' · ' + ha(minDesde(c.atualizado)));

      h += `<details class="card"${i === 0 ? ' open' : ''}><summary style="cursor:pointer"><b>Dia ${esc(d.dia)}</b> · ✅ ${d.ok} · ❌ ${d.x}${d.sd ? ` · sem dado ${d.sd}` : ''}${cfPct(d)}</summary>`;

        h += (j.itens || []).map((it) => `<div class="fav" style="margin:5px 0 0;white-space:normal"><span style="color:${cfCor(it.res)}">${it.res === 'sem dado' ? '➖' : esc(it.res)}</span> ${esc(it.icone || '')} ${it.time && it.tipo !== 'perna de múltipla' ? `<b>${esc(it.time)}</b> ` : ''}${esc(it.txt)}<span class="meta" style="white-space:normal"> · ${/^Destaque|^Múltipla|^Favorito|^Aviso/.test(it.origem || '') ? esc(it.origem) + ' · ' : ''}${esc(it.det || '')}</span></div>`).join('');
        h += '</div>';
      });
      h += '</details>';
    });
    return h + `<p class="note" style="margin:6px 4px 14px">Conferido pelo robô com o resultado real. ➖ = não deu para conferir. É só medição: não muda cor nem aposta.</p>`;
  }
  // Aprendizado: por enquanto só a contagem da amostra por tipo. Nada muda sozinho; sugestão de ajuste só com amostra e com aprovação.
  function blocoAprendizado() {
    const c = data.report && data.report.conferencia, tp = ((c && c.tipos) || []).filter((t) => t.ok + t.x > 0);
    if (!tp.length) return '';
    const META = 50;
    let h = sec('Aprendizado: o que acerta mais', 'medindo · nada muda sozinho');
    h += `<div class="card"><div class="row"><b>Total</b><span class="meta">✅ ${c.total.ok} · ❌ ${c.total.x}${cfPct(c.total)}</span></div>`;
    tp.slice().sort((a, b) => (b.ok + b.x) - (a.ok + a.x)).forEach((t) => {
      const n = t.ok + t.x, w = Math.min(100, n / META * 100);
      h += `<div class="ap"><div class="row"><div class="fav" style="margin:0"><b>${esc(cap(t.tipo))}</b></div><div class="meta">✅ ${t.ok} · ❌ ${t.x} · <b>${t.pct}%</b></div></div>
        <div class="apb"><i style="width:${w.toFixed(0)}%;background:${n >= META ? 'var(--green)' : 'var(--muted2)'}"></i></div>
        <div class="k2">${n >= META ? 'amostra suficiente para avaliar' : `amostra ${n} de ${META}: ainda cedo para concluir`}</div></div>`;
    });
    return h + `<p class="note" style="margin:10px 0 0">O sistema está juntando acertos e erros por tipo de informação. Por time, liga e característica entra quando a planilha mandar. Com amostra suficiente, o robô sugere ajustes e você aprova. Nada muda sem o seu ok.</p></div>`;
  }
  function viewAnalise() {
    const r = data.report, s = SUB.analise;
    let h = '<div class="chips subs">' + [['destaques', 'Destaques'], ['jogos', 'Jogo a jogo'], ['acertos', 'Acertos']].map(([k, t]) => `<button type="button" class="chip ${s === k ? 'on' : ''}" data-sub="${k}">${t}</button>`).join('') + '</div>';
    if (s === 'acertos') return h + blocoPlacarCores() + blocoAprendizado() + blocoConferencia();

    const m = minDesde(r.geradoEm);
    h += `<div class="hero none"><div><div class="t">Análise do dia ${esc(r.dia)} · ${(r.jogos || []).length} jogos da DG</div><div class="s"><span class="d ${frescor(m)}"></span> gerada ${esc(hhmm(r.geradoEm))} · ${ha(m)} · apoio para decidir, não é proposta</div></div></div>`;

    if (s === 'destaques') {
      const top = ordHora((r.top || []).filter(repPassa));

    let n = 0;
    repJogos().forEach((x) => {

      const li = (f) => `<div class="fav" style="margin:6px 0 0;white-space:normal">${esc(f.icone)} ${repFrase(f)}${f.selo === 'ajuda' ? ' ✅' : ''}${f.aposta ? ` <span class="meta" style="white-space:normal">· sugere ${esc(sugestao(f.aposta).txt.toLowerCase())}${sugestao(f.aposta).odd ? ' @' + odd(sugestao(f.aposta).odd) : ''}</span>` : ''}</div>`;

        ${x.z && x.j.favorito ? `<div class="gs" style="margin-top:3px">Decisão: <b>${esc(entrada(x.j))}</b> @${odd(x.j.odd)} · ${NOME[x.t]}</div>` : ''}

      <div class="tile"><div class="l">CLV médio</div><div class="v sm ${sgn(p['CLV MÉDIO'])}">${esc(p['CLV MÉDIO'] || '—')}</div></div></div>`;
    if (hist.length) {
      const mx = Math.max(1, ...hist.map((r) => Math.abs(num(r['LUCRO DO DIA']) || 0)));
      h += sec('Dia a dia', 'lucro do dia') + '<div class="card">';
      hist.slice().reverse().forEach((r) => {
        const n = num(r['LUCRO DO DIA']) || 0, w = Math.abs(n) / mx * 100;
        h += `<div class="hist"><div class="dt">${esc(String(r['DATA'] || r['ABA']).slice(0, 5))}</div>
          <div class="bw"><i style="width:${w.toFixed(0)}%;background:${n >= 0 ? 'var(--green)' : 'var(--red)'}"></i></div>
          <div class="lu ${n >= 0 ? 'pos' : 'neg'}">${esc(r['LUCRO DO DIA'] || '—')}</div></div>`;
      });
      h += '</div>';
    }
    return h;
  }
  function viewAlertas() {
    const al = data.alertas || [];
    if (!al.length) return '<div class="empty">Nenhum alerta ainda.</div>';
    // dia mais novo primeiro; dentro do dia, pelo horário do jogo do alerta (sem jogo: pelo horário do próprio alerta)
    const qd = (a) => { const m = String(a.quando || '').match(/(\d{1,2})\/(\d{1,2})(?:\D+(\d{1,2}:\d{2}))?/); return m ? { dia: +m[2] * 100 + +m[1], d: String(+m[1]), hora: m[3] || '' } : { dia: 0, d: null, hora: '' }; };
    const lst = al.map((a, i) => { const q = qd(a), z = a.jogo && a.jogo !== '—' && q.d ? acha(q.d, a.jogo) : null, hj = z ? z.j.hora : ''; return { a, i, dia: q.dia, hj, h: hmin(hj || q.hora) }; })
      .sort((x, y) => y.dia - x.dia || x.h - y.h || x.i - y.i);
    let h = '', ult = null;
    lst.forEach(({ a, hj, dia }) => {
      if (dia !== ult) { ult = dia; h += sec('Dia ' + String(dia % 100).padStart(2, '0') + '/' + String(Math.floor(dia / 100)).padStart(2, '0'), 'pelo horário do jogo'); }
      const m = String(a.msg || ''), t = m.includes('🟢') || m.startsWith('✅') ? 'g' : m.includes('🟡') || m.startsWith('⚠') || m.startsWith('🎯') ? 'a' : m.includes('🔴') || m.startsWith('❌') ? 'r' : '';
      h += `<div class="card alert ${t}"><div class="row"><div class="when">enviado ${esc(a.quando)}</div>${a.jogo && a.jogo !== '—' ? `<div class="meta">${hj ? 'jogo ' + esc(hj) + ' · ' : ''}${esc(a.jogo)}</div>` : ''}</div>
        <div class="msg">${esc(m)}</div></div>`;
    });
    return h;
  }
  function viewConta() {
    const s = SUB.conta, n = (data.alertas || []).length;
    return '<div class="chips subs">' + [['apostas', 'Minhas apostas'], ['painel', 'Painel'], ['alertas', 'Alertas' + (n ? ` <small>${n}</small>` : '')]].map(([k, t]) => `<button type="button" class="chip ${s === k ? 'on' : ''}" data-sub="${k}">${t}</button>`).join('') + '</div>' +
      ({ apostas: viewApostas, painel: viewPainel, alertas: viewAlertas })[s]();
  }

  // ================== FICHA COMPLETA DO JOGO ==================
  function openJogo(i) {
    const j = todos()[+i]; if (!j) return;
    const t = tier(j);
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const p = (k, v) => (v ? `<div class="p"><b>${k}</b>${esc(v)}</div>` : '');
    const kv = (k, v, cls) => (v && v !== '—' ? `<div><div class="k">${k}</div><div class="n ${cls || ''}">${esc(v)}</div></div>` : '');
    bg.innerHTML = `<div class="sheet"><div class="grab"></div>
      <div class="row"><div class="meta">${diaLabel(j)}<b class="hr">${esc(j.hora)}</b> · ${esc(j.liga)}</div>${pill(t)}</div>
      <div class="jogo" style="font-size:20px">${esc(j.jogo)}</div>
      <div class="ent" style="margin-top:10px"><div><div class="k">ENTRADA</div><div class="e">${esc(entrada(j))}</div><div class="k2">${MERCADO} · ${esc(casaDe(j) || 'casa da DG')} · stake ${STAKE}</div></div>
        <div class="ob"><div class="k">ODD</div><div class="o">${odd(j.odd)}</div></div></div>
      ${linhaVeredito(j)}
      <div class="vsub">${comecou(j) ? '' : lido(j) + ' '}${j.apostada ? '<span style="color:var(--blue)">você apostou</span>' : ''}</div>
      <div class="kv">
        ${kv('Valor (com antecipado)', j.valor || j.valorNovo, evClass(j.valor || j.valorNovo))}${kv('Nota (0 a 100)', j.nota || j.cenario)}
        ${kv('Odd justa', j.oddJusta ? odd(j.oddJusta) : '')}${kv('Odd-alvo verde', (j.alvoVerde || j.oddAlvo) ? odd(j.alvoVerde || j.oddAlvo) : '')}
        ${kv('Odd-alvo amarelo', (j.alvoAmarelo || j.oddAlvoAmarelo) ? odd(j.alvoAmarelo || j.oddAlvoAmarelo) : '')}${kv('Alvo (EV +2%)', j.oddMinima ? odd(j.oddMinima) : '')}
        ${kv('EV puro (Pinnacle)', j.evPinnacle, evClass(j.evPinnacle))}${kv('EV pelo método', j.evMetodo, evClass(j.evMetodo))}
        ${kv('Prob. estimada', j.prob)}${kv('Critérios', j.criterios)}
      </div>
      ${raioTabela(j)}
      ${p('Motivo da cor', motivo(j))}${p('Dimensões da nota', j.dims || j.dimensoes)}${p('Referência de preço', j.ref || j.referencia)}${p('Contexto', j.alertaContexto || j.contexto)}${p('A favor', j.aFavor)}${p('Contra', j.contra)}
      ${j.resultado ? p('Sua aposta', j.resultado + (j.lucro ? ' · ' + j.lucro : '')) : ''}
      <div class="note" style="margin-top:12px">Stake fixa ${STAKE}. A aposta é feita por você na casa.</div>
      ${ehPM(j) ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${esc(linkAposta(j))}" target="_blank" rel="noopener">Abrir na Parimatch</a>` : ''}
      <button class="btn ghost" type="button" id="shareS">Compartilhar</button>
      <button class="btn ghost" type="button" id="closeS">Fechar</button></div>`;
    document.body.appendChild(bg);
    bg.querySelector('#shareS').addEventListener('click', () => compartilhar(textoEntrada(j)));
    bg.addEventListener('click', (e) => { if (e.target === bg || e.target.id === 'closeS') bg.remove(); });
  }
  async function compartilhar(txt) {
    try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(txt); toast('Copiado. Cole no WhatsApp.'); } catch (e) { location.href = 'https://wa.me/?text=' + encodeURIComponent(txt); }
  }
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

  // ================== MONTAGEM ==================
  function viewKey() {
    return `<div class="card"><div class="jogo">Conectar à planilha</div>
      <p class="note">Cole a chave de acesso que você recebeu. Ela fica só neste aparelho.</p>
      <input id="keyin" placeholder="chave de acesso" autocomplete="off">
      <button class="btn" id="keybtn" type="button">Entrar</button></div>`;
  }
  const TIT = { apostar: 'Apostar', multiplas: 'Múltiplas', jogos: 'Todos os jogos', analise: 'Análise', conta: 'Conta' };
  const VIEW = { apostar: viewApostar, multiplas: viewMultiplas, jogos: viewJogos, analise: viewAnalise, conta: viewConta };
  function render(keep) {
    const y0 = window.scrollY, m = $('#main');
    // não redesenha por cima de quem está digitando na busca ou com um bloco aberto pela pessoa
    const abertos = keep ? [...m.querySelectorAll('details')].map((d, i) => (d.open ? i : -1)).filter((i) => i >= 0) : null;
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    pintaSync();
    if (!KEY) { $('#htitle').textContent = 'Favoritos'; $('#hdate').textContent = 'configuração'; m.innerHTML = viewKey(); $('#keybtn').onclick = () => { const v = $('#keyin').value.trim(); if (!v) return; KEY = v; localStorage.setItem(LS.key, v); load(true); }; return; }
    if (!data) { m.innerHTML = '<div class="empty">Carregando os dados da planilha…</div>'; return; }
    const d = data.hoje || {};
    $('#hdate').textContent = (d.kpi && d.kpi.DATA) ? d.kpi.DATA : ('dia ' + data.dia);
    $('#htitle').textContent = TIT[tab];
    if (keep && tab === 'jogos' && document.activeElement && document.activeElement.id === 'zq') { pintaJogos(); return; }
    let html;
    try { html = VIEW[tab](); } catch (e) { console.error(e); html = `<div class="empty">Não consegui montar esta tela.<br><span class="meta">${esc(e.message)}</span></div>`; }
    m.innerHTML = html;
    const ms = (data.hoje && data.hoje.multiplas || []).filter((x) => !x.resultado).length, bm = $('#nbm');
    if (bm) { bm.textContent = ms || ''; bm.classList.toggle('hidden', !ms); }
    if (tab === 'jogos') { pintaJogos(); $('#zq').addEventListener('input', (e) => { Z.q = e.target.value; pintaJogos(); }); }
    if (abertos) { const ds = m.querySelectorAll('details'); if (ds.length) abertos.forEach((i) => { if (ds[i]) ds[i].open = true; }); }
    window.scrollTo(0, keep ? y0 : 0);
  }
  const vai = (t) => { tab = t; localStorage.setItem(LS.tab, tab); render(); };

  // ================== EVENTOS (um ouvinte só para a tela toda) ==================
  $('#main').addEventListener('click', (e) => {
    const q = (s) => e.target.closest(s);
    let b;
    if ((b = q('[data-share]'))) { e.stopPropagation(); return compartilhar(textoEntrada(todos()[+b.dataset.share])); }
    if (q('[data-shareall]')) {
      const js = doDia(data.dia).filter((x) => tier(x.j) === 'g' && !comecou(x.j) && !x.j.resultado).map((x) => x.j);
      if (js.length) compartilhar('🔥 Propostas para apostar · ' + ((data.hoje.kpi && data.hoje.kpi.DATA) || 'hoje') + '\n\n' + js.map(textoEntrada).join('\n\n'));
      return;
    }
    if (q('a')) return;
    if ((b = q('[data-gotab]'))) return vai(b.dataset.gotab);
    if ((b = q('[data-sub]'))) { SUB[tab] = b.dataset.sub; localStorage.setItem(LS.sub, JSON.stringify(SUB)); return render(); }
    if ((b = q('[data-rep]'))) { repFiltro = b.dataset.rep; return render(true); }
    if ((b = q('[data-zdia]'))) { Z.dia = b.dataset.zdia; return render(); }
    if ((b = q('[data-zcor]'))) { Z.cor = b.dataset.zcor; return pintaJogos(); }
    if (q('summary') || q('details.mais')) return;
    if ((b = q('[data-z]'))) return openJogo(b.dataset.z);
  });
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => vai(b.dataset.tab)));
  $('#sync').addEventListener('click', () => load(true));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  render(); load(false);
  setInterval(() => { if (!document.hidden) load(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
